<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo thực hành</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.6;
      }

      .demo-box {
        border: 1px solid #ddd;
        padding: 12px;
      }

      .demo-box input {
        padding: 6px 8px;
        width: 200px;
        max-width: 100%;
      }

      #ds {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
      }

      #ds li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eee;
        padding: 8px 0;
      }

      #ds button {
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="demo-box">
      <form id="form">
        <label for="oten">Tên món:</label>
        <input type="text" name="oten" id="oten" placeholder="VD: pizza" />
        <button type="submit">Thêm món</button>
      </form>

      <ul id="ds"></ul>
    </div>

    <script>
      // ô nhập: click vào thì viền xanh, bỏ ra thì về như cũ
      $("#oten").on("focus", function () {
        $(this).css("border", "2px solid blue");
      });

      $("#oten").on("blur", function () {
        $(this).css("border", "");
      });

      $("#form").on("submit", function (e) {
        e.preventDefault();

        const ten = $("#oten").val().trim();
        if (ten === "") return;

        const li = $("<li></li>");
        const span = $("<span></span>").text(ten);
        const nutXoa = $("<button type='button'>X</button>");

        // rê chuột vào dòng thì đổi màu nền
        li.hover(
          function () {
            li.css("background-color", "#f0f8ff");
          },
          function () {
            li.css("background-color", "");
          },
        );

        // bấm vào tên món thì gạch ngang, bấm lần nữa thì bỏ gạch
        span.on("click", function () {
          const gach = span.css("text-decoration-line");
          if (gach === "line-through") {
            span.css({ "text-decoration": "none", color: "black" });
          } else {
            span.css({ "text-decoration": "line-through", color: "gray" });
          }
        });

        // rê chuột vào nút X thì đổi đỏ
        nutXoa.hover(
          function () {
            nutXoa.css({ "background-color": "red", color: "white" });
          },
          function () {
            nutXoa.css({ "background-color": "", color: "" });
          },
        );

        nutXoa.on("click", function () {
          li.remove();
        });

        li.append(span, nutXoa);
        $("#ds").append(li);

        $("#oten").val("").focus();
      });
    </script>
  </body>
</html>
